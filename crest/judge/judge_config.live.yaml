# CREST judge panel — LIVE config (used for runs). THE ONLY config any code path loads.
# Read by JudgePanel.from_config: `judges`, `threshold_all_three`, `min_judges`,
# `leave_one_family_out`. Nothing else here is consulted — do not add controls that no code
# implements. The unimplemented ones (`randomize_answer_order`, a `fact_precision` grounding gate,
# `human_validation_required_categories`) used to sit in a sibling `judge_config.yaml`; that file was
# read by nothing and is gone -- its content is now docs/judge_protocol_intent.md, documentation only.

threshold_all_three: 6.0        # retained for backwards comparability; NOT the primary endpoint --
                                # it is unpre-registered and the creative rate swung 5.4-36.1% across
                                # t=5..7 ON THE PILOT (46.4-56.0% on canonical run 040653Z), with
                                # 13.6% (34/250) of that run's records sitting exactly on 6.00 on
                                # some axis (~26% on the pilot; no pilot data survives to recheck
                                # it). Report min(New, Useful, Surprising) as primary instead:
                                # graded, on the 1-10 scale, all three NUS axes.

min_judges: 2                   # below this a record is flagged `judge_degraded`, not silently
                                # averaged: a single surviving judge is not a panel.

# ---------------------------------------------------------------------------------------------
# leave_one_family_out: FALSE — the full panel scores every entrant. MEASURED-AND-WITHDRAWN, not
# unimplemented: LOFO ran as the default and lost to its own cost. With exactly 3 vendors it made
# judge identity perfectly CONFOUNDED with entrant family. Paired within the same records on run
# 040653Z, judge_google is a severity outlier on min(N,U,S): +2.72 vs judge_openai, +3.38 vs
# judge_anthropic, while those two differ by 0.65. LOFO removed the lenient judge deterministically
# for exactly the Google entrants, so the two bottom-ranked entrants were precisely the two it never
# scored, ~60% of the observed leaderboard spread tracked panel composition (measured on the
# LOFO-protocol run, now deleted; derivation in docs/notes/iclr_metareview.md -- reconstructing the
# LOFO subset from 040653Z reproduces the direction, Gemini -0.80/-0.54 with every other entrant
# positive), and NO judge scored all five entrants -- no common-judge comparison. The
# anti-self-preference control introduced a larger bias than the one it removed. The bias it targets
# is itself sign-inconsistent by judge (for the Anthropic judge LOFO removed a judge that was
# HARSHER on its own family); the source paper's bias table is in docs/benchmark_best_practices.md.
#
# LOFO is demoted from assumption to measurement, not abandoned. Every judge row stamps
# `same_family`, so the LOFO subset is recoverable post-hoc as the `same_family == false` rows, and
# self-preference enters the model as a covariate (analysis/stats.py runs MixedLM) instead of being
# excluded by fiat. Set this back to true only to reproduce the old protocol.
leave_one_family_out: false

judges:
  - id: judge_anthropic
    model: claude-sonnet-5
    family: anthropic
  - id: judge_openai
    model: gpt-5
    family: openai
  - id: judge_google
    model: gemini-2.5-pro
    family: google
# A 4th, genuinely open-weight judge remains the OUTSTANDING GAP (spec in
# docs/judge_protocol_intent.md): with only 3 vendors the panel has no redundancy, and losing one
# leaves too few judges. Gemma is on the Google key but shares Google's lineage, so labelling it
# `open_weight` would not buy independence. Satisfying this needs a third-party host
# (Together/Fireworks/Groq).
