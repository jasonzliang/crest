# CREST judge panel — LIVE config (used for runs).
# Only `judges` and `threshold_all_three` are read by JudgePanel.from_config. 3 vendors so
# leave-one-family-out always leaves >=2 judges when scoring an Anthropic or OpenAI entrant.
# The full protocol (open-weight 4th judge + reliability/human-validation intent) is documented
# in judge_config.yaml.
threshold_all_three: 6.0
judges:
  - id: judge_anthropic
    model: claude-sonnet-5
    family: anthropic
  - id: judge_openai
    model: gpt-5
    family: openai
  - id: judge_google
    model: gemini-2.5-pro
    family: google
