[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crest-research"
version = "0.2.0"
description = "Cached research generation, binary pairwise judging, and creativity ranking"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "PyYAML>=6,<7", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8"]
ais = ["PyMuPDF>=1.24,<2"]

[project.scripts]
crest = "crest.cli:main"

[tool.setuptools.packages.find]
include = ["crest", "crest.providers", "crest_ais", "crest_ais.providers"]

[tool.setuptools.package-data]
crest = ["prompts/*.txt", "data/*.jsonl"]
crest_ais = ["config.json", "contract.json", "provider_snapshot.json", "rubric.txt"]

[tool.pytest.ini_options]
testpaths = ["tests", "crest_ais/tests"]
