# Research, judging, and analysis settings; defaults and validation: crest/config.py.
# Relative paths resolve from this file's directory, not the working directory.
# Credentials are environment variables, not values stored in this file:
#   OpenAI, Caesar, GPT Researcher: OPENAI_API_KEY.
#   Google research/judging: GOOGLE_API_KEY, falling back to GEMINI_API_KEY.
#   Anthropic research/judging: each api_key_env names the key for its api_base;
#   both currently use LITELLM_API_KEY. This does not change global Anthropic credentials.
#
# Inputs and outputs. v1 alternatives: ../data/queries_n50_v1.jsonl and
# ../prompts/nus_pairwise_v1.txt. The active rubric below is NUS v3; v2 and v1 remain.
questions: ../data/queries_n50_v2.jsonl
rubric: ../prompts/nus_pairwise_v3.txt
cache_dir: ../results/.cache/generation
output_dir: ../results
results_timezone: America/Chicago  # Directory naming timezone; event timestamps remain UTC.

# Answer length: null means no word-count cap; token and budget limits still apply.
# Agents inherit this value unless they set a numeric answer_word_limit.
# A numeric cap requires {max_words} in the shared/applicable continuation prompts;
# Caesar instead passes it to Rome as a synthesis word target.
answer_word_limit: null

# Used by agents with use_research_prompt: true; {question} is substituted per task.
# With that flag false, Caesar receives the bare question and Rome owns its prompts.
research_prompt: |-
  ### QUERY

  {question}

  ### YOUR TASK

  Use deep research to create a novel, exciting, and thought-provoking response that creatively answers the query above. Focus on the following:
  - Emergent patterns not visible in individual sources
  - Novel discoveries, connections, or applications
  - Surprising new directions or perspectives
  - Interesting tensions, contradictions, or open questions

  IMPORTANT: Avoid excessive jargon, ensure artifact text is well-organized (logical, clear, focused), and convincing to a skeptical reader

# OpenAI/Anthropic run a fixed max_research_rounds (initial round plus follow-ups),
# chosen from pilot costs so totals land near $3 within $2-4. A follow-up is skipped
# only when one as costly as the last would pass budget_usd. This prompt starts each
# follow-up; {spent} and {ceiling} (and optionally {floor}) are substituted at runtime.
research_continuation_prompt: |-
  Your research so far cost ${spent} of a ${ceiling} research budget. Continue the research: run further web searches on the aspects of the query that are weakest or least evidenced, read the most promising sources, and then rewrite the complete response so that it stands alone and incorporates the new findings. Keep every requirement of the original task.

# Research budgets apply per answer, across its turns and rounds.
# soft: report dollar-ceiling overruns without request refusal/cancellation.
# Finite work/token/time limits remain.
# hard: enforce provider-specific limits; delayed/estimated usage can still overrun.
# auto: hard enforcement plus settings derived by crest/budget.py: Caesar depth,
# reserve and timeout; OpenAI/Anthropic floor and round cap; GPT Researcher target.
# All active research profiles use soft. Gemini supports only soft; the others
# retain explicit hard/auto for reproducibility and stricter future runs.
# initial_concurrency starts each adaptive limiter; concurrency is its maximum.
research:
  caesar:
    use_research_prompt: false  # Rome receives the bare question.
    # Local checkout, then synthesis/exploration/knowledge-base model settings.
    rome_path: ../../../rome
    model: gpt-6.1-sol
    reasoning_effort: medium
    synthesis_reasoning_effort: high  # Draft/merge reasoning only; main research remains medium.
    exploration_model: gpt-6-luna
    exploration_reasoning_effort: low
    kb_model: gpt-6-luna
    kb_reasoning_effort: low
    # Per-request output limits, independent of answer word count.
    max_completion_tokens: 32768  # Per synthesis request, including reasoning.
    query_max_completion_tokens: 6000  # Output cap for synthesis Q&A requests.
    # Budget enforcement and exploration/synthesis depth.
    budget_usd: 4.0
    budget_cap: soft
    max_iterations: 300  # Exploration iterations.
    synthesis_drafts: 3
    synthesis_iterations: 20  # Q&A refinement rounds per draft.
    synthesis_reserve_usd: 2.6  # Used only in hard/auto; soft does not reserve or cap synthesis spending.
    timeout_seconds: 21600  # Six-hour whole-answer ceiling; not a predicted runtime.
    # Retrieval, reranking, and exploration.
    synthesis_top_k: 50
    synthesis_top_n: 10  # Retain up to this many notes after reranking.
    enable_reranking: true  # Native LLM reranking uses the KB model.
    max_depth: 6  # Link depth from a starting page.
    max_web_searches: 5  # Searches used to reseed exploration.
    exploration_max_completion_tokens: 2000  # Per exploration request.
    kb_max_completion_tokens: 2000  # Per KB answer/ranking request; also sizes its prompt helper.
    additional_starting_queries: 11
    use_quick_explore: false
    quick_explore_insights: true
    quick_explore_workers: 2
    adapt_role: true
    synthesis_merge_artifacts: true
    # Call timeout and adaptive concurrency.
    call_timeout_seconds: 1200  # Twenty minutes for a synthesis request.
    # Answers take ~2.7 h, so start wide; 50 ran together on 2026-11-23 without rate limits.
    initial_concurrency: 25
    concurrency: 50
  # Hosted research rounds; usage may only become available after completion.
  openai:
    use_research_prompt: true
    model: gpt-6.1-sol
    reasoning_effort: high
    search_context_size: high  # Search context requested per call.
    budget_usd: 4.0  # Warning threshold; soft does not cancel hosted work at this amount.
    budget_cap: soft
    max_research_rounds: 5  # Initial response + 4 follow-ups (pilot mean ~$3.1); fewer only if the next would pass budget_usd.
    max_output_tokens: 100000  # Per response, including reasoning.
    max_tool_calls: 150  # Per-response tool-call cap.
    initial_concurrency: 6
    concurrency: 12
  # Managed agent: no exposed depth/effort setting; its budget is warning-only.
  gemini:
    use_research_prompt: true
    agent: deep-research-preview-04-2026
    billing_model: gemini-3.1-pro-preview  # Reference model for cost estimates, not the managed agent selector.
    budget_usd: 4.0
    budget_cap: soft  # Only supported mode for this managed agent.
    initial_concurrency: 4
    concurrency: 8
  # Anthropic Messages through the configured gateway, with client-side research tools.
  anthropic:
    use_research_prompt: true
    model: claude-opus-5-5
    api_base: https://litellm.evolution.ml
    api_key_env: LITELLM_API_KEY  # Environment-variable name, not a key literal.
    tool_mode: client  # Local search/fetch; retrieved text still incurs model token costs.
    # USD per million tokens; web_search is per call and is zeroed in client mode.
    model_pricing:
      claude-opus-5-5: {input: 4.4, cached_input: 0.22, cache_write_5m: 5.5, output: 22.0, web_search: 0.0}
    effort: high
    budget_usd: 4.0  # Warning threshold, not an enforced dollar ceiling.
    budget_cap: soft  # No dollar-based refusal or token shrinking; usage is still recorded.
    max_research_rounds: 7  # Initial round + 6 follow-ups: half Sonnet's 14, as Opus tokens cost 2x and client search is free for both; fewer if the next would pass budget_usd or no search is left.
    max_output_tokens: 64000  # Per turn; client hard mode may lower it to fit remaining budget.
    max_web_searches: 30  # Client searches across the answer, including bootstrap; failed ones don't count, attempts stop at 2x.
    web_fetch: true  # Allow full-page reads.
    max_web_fetches: 10  # Client page fetches across the answer; failed ones don't count, attempts stop at 2x.
    max_continuations: 50  # Client tool-request turns across all research rounds.
    refusal_fallback: false  # Do not switch models after a refusal.
    timeout_seconds: 5400  # Across rounds, turns, and retries.
    initial_concurrency: 4
    concurrency: 8

  # Isolated checkout/interpreter; requests and final synthesis share one budget ledger.
  gpt_researcher:
    use_research_prompt: true
    gpt_researcher_path: ../../../gpt-researcher
    python_executable: ../../../gpt-researcher/.venv/bin/python  # Keep the venv executable path for environment isolation.
    model: gpt-6.1-sol  # Shared FAST, SMART, and STRATEGIC model.
    reasoning_effort: high
    budget_cap: soft  # Meter requests/retries; dollar overruns warn rather than block synthesis.
    budget_usd: 4.0
    budget_target_usd: 3.4  # Handoff target; minus the $0.50 allowance leaves ~$2.90 for research, not guaranteed spend.
    synthesis_reserve_usd: 0.5  # Planning allowance for the 32k writer; not protected funds in soft mode.
    deep_research_breadth: 4
    deep_research_depth: 3
    deep_research_concurrency: 2
    max_iterations: 3
    max_search_results_per_query: 5
    max_research_rounds: 3  # Research passes; follow-ups stop at the $3.40 handoff target or on repeated sources.
    max_completion_tokens: 32000  # Reasoning + visible output; the prior 8k cap was exhausted by xhigh reasoning.
    synthesis_max_completion_tokens: 32000  # Same headroom for the final writer; no word-count cap.
    max_input_tokens: 64000  # Conservative UTF-8 JSON + framing bound, not a tokenizer count/context window.
    retry_attempts: 1  # Retry explicitly rejected rate-limit requests; each is admitted separately.
    timeout_seconds: 5400  # Whole answer, including research drain and final synthesis.
    call_timeout_seconds: 600  # Writer headroom; the earlier 180-second synthesis timed out.
    initial_concurrency: 4
    concurrency: 8

# Tool-free pairwise judgments in both answer orders, using the credentials above.
# Research budget settings do not cap judging costs.
judges:
  openai:
    model: gpt-6.1-sol
    reasoning_effort: high
    max_output_tokens: 32768
    initial_concurrency: 8
    concurrency: 16
  gemini:
    model: gemini-4-argon
    thinking_level: high
    max_output_tokens: 32768
    initial_concurrency: 8
    concurrency: 16
  anthropic:
    model: claude-opus-5-5
    api_base: https://litellm.evolution.ml
    api_key_env: LITELLM_API_KEY  # Independent of the research credential setting.
    # USD per million tokens; web_search is per call (judges do not use tools).
    model_pricing:
      claude-opus-5-5: {input: 4.4, cached_input: 0.22, cache_write_5m: 5.5, output: 22.0, web_search: 0.01}
    effort: high
    max_output_tokens: 32768
    refusal_fallback: false  # The gateway ignores the API's server-side fallback.
    # After Opus refuses every allowed attempt, the same prompt goes to this stand-in;
    # each attempt records its model. Not part of the judgment cache key.
    refusal_substitute:
      model: claude-sonnet-5-5
      rates: {input: 2.2, cached_input: 0.11, cache_write_5m: 2.75, output: 11.0, web_search: 0.0}
    initial_concurrency: 8
    concurrency: 16

# Offline bootstrap analysis; seed controls question resampling.
analysis:
  bootstrap_samples: 1000
  seed: 2026
  workers: 0  # 0 selects automatic CPU parallelism; small workloads may stay serial.
