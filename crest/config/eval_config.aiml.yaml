# CREST evaluation config -- the SECOND item file (AI/ML), DEEP ARM ONLY.
# Run:  python crest/run_eval.py --config crest/config/eval_config.aiml.yaml
#
# Separate file rather than editing eval_config.yaml, because that file defines the SHIPPED
# science-set protocol whose numbers are cited in both papers. Pointing it at a different item set
# would make the cited run's config snapshot ambiguous.
#
# READ BEFORE RUNNING. Three things about this item set that the science set does not share:
#   1. It has had NO audit of any kind -- no design sidecar (0 of its 50 ids appear in
#      item_design.jsonl), no citation audit, no live-web audit. The AUDITED science set turned out
#      to contain C4_engineering_45, whose novelty gate was inverted so that an agent following the
#      item's own hint reproduced published prior art and scored as NOVEL. Nothing has looked for
#      that class of defect here.
#   2. No paper claims it, and readme.md says it is "not run or scored". Scoring it does not make it
#      a released artifact.
#   3. OUT OF DATE AND DANGEROUS AS WRITTEN (corrected 2026-08-01). This said the items had never
#      been generated against, so the cache serves ZERO and "every task is paid in full". Measured
#      today with real cache-key lookups: 250/250 tasks resolve from cache. Three runs have since
#      been paid for. Do NOT budget a full re-generation off this comment -- and do not budget off
#      `--dry-run` either, which prints only the cache INDEX SIZE ("492 entries"), a number that
#      does not move when the fingerprint changes and the real hit rate goes to zero. That exact
#      insensitivity cost ~$450 once already. Run ci_check.sh's adapter_fp continuity check instead.
benchmarks:
  - name: crest_aiml
    challenges: crest/question/crest_aiml_challenges.jsonl
    per_category: null
    limit: null
    categories: null
    subset_label: null

# ALL FIVE entrants, matching the science run's shape so the two are comparable in structure.
agents:
  # -- shallow arm (chat + native web search, one turn, cents/task) --
  - claude_shallow            # claude-sonnet-5             + web_search (max_uses=budget)
  - openai_shallow            # gpt-5.6                     + Responses web_search
  - gemini_shallow            # gemini-3.1-pro-preview      + google_search grounding
  # -- deep arm (managed multi-step research loop, $$/task) --
  - openai_deepresearch       # gpt-5.6-sol, effort=high, max_tool_calls=40   ~$9/task  (UNVERIFIED)
  - gemini_deepresearch_max   # deep-research-max-preview-04-2026             ~$6/task  (UNVERIFIED)
# Anthropic ships no turnkey deep-research API, so the deep arm has no Anthropic entrant. That is an
# asymmetry to disclose, not a null result for Claude.

judge_config: crest/judge/judge_config.live.yaml
budget: 6
# 12, raised from 4 once the real bottleneck was measured. The DEEP ARM IS 90-93% OF ALL THE WORK
# (100 tasks x 20-30 min vs 150 shallow x ~1.5 min), so wall-clock is essentially
# deep-task-duration / concurrency: measured 9-13 h at 4, 4.6-6.7 h at 8, 3-4.5 h at 12.
# Safe to raise despite the earlier cap, for a reason that was true all along and that I missed when
# I dropped it to 4: THE DEEP ARM MAKES NO ANTHROPIC CALLS AT ALL. Only claude_shallow generation and
# the 3 judge_anthropic calls per completed record touch Anthropic, and judges fire on completion, so
# Anthropic load scales with the RECORD RATE (~2/min observed), not with concurrency directly.
# Two further changes since the cap: two healthy keys are pooled rather than one, and keys.py now has
# a provider-wide cooldown gate that sheds load instead of letting each task burn its own retries.
# Concurrency is also NOT part of adapter_fingerprint (that covers agents.py + keys.py source, the
# class name, the model and the budget), so changing it re-uses every cached generation.
# Historical note kept below because it explains why 4 looked necessary:
# 4. Was 8 (the science run's value) and 8 TRIPPED THE ANTHROPIC SPEND-RATE CAP on this account, in
# run 2026-07-31T180746Z: 3 claude_shallow tasks lost and judge_anthropic dropped from 11 of 31
# records. So "proven on this account" was proven for that run's conditions, not for today's -- a
# rate cap depends on what else the account has spent recently, and the science run had already
# consumed part of the window. 4 halves the Anthropic call rate; judge_anthropic fires on all 5
# entrants under the full panel, so it is the hottest path in a run.
# The provider-wide cooldown gate added to keys.py is the real defence; this is just less load.
# NOTE the historical reasoning below is kept because it explains why 8 LOOKED safe:
# 8, matching the science run, because that value is PROVEN on this account rather than guessed.
# That run: concurrency 8, FULL panel (so judge_anthropic fired on all 5 entrants, not 4 of 5 as an
# older LOFO-era comment says), 250 records, on a SINGLE Anthropic key -- and its manifest records
# n_judge_degraded 0, n_judge_error 0, n_task_errors 0. So the spend-rate cap is not reached here.
# I first set this to 4 out of caution about that cap; the incident that motivated the caution was at
# concurrency 16, which is 2x the proven-safe value, and 4 merely doubled wall clock for nothing.
# NOT raised to 12+: untested between a proven-good 8 and a known-bad 16, and the failure mode is a
# SILENTLY thinned judge panel, which would corrupt the run rather than fail it.
concurrency: 12
use_cache: true              # will serve 0 of these items; kept true so a RESUMED run reuses what
                             # this run already paid for rather than re-paying it.
trust_legacy_cache: false
out_root: crest/result
