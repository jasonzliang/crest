# Paths are relative to this file. Credentials come only from the environment.
questions: crest/data/queries_n50.jsonl
rubric: crest/prompts/nus_pairwise.txt
cache_dir: results/.cache/generation
output_dir: results

research:
  caesar:
    rome_path: ../rome
    model: gpt-6.1-sol
    exploration_model: gpt-6-luna
    kb_model: gpt-6-luna
    budget_usd: 5.0
    handler_budget_usd: 5.0
    max_iterations: 250
    synthesis_drafts: 3
    synthesis_iterations: 15
    additional_starting_queries: 11
    use_quick_explore: true
    quick_explore_insights: true
    quick_explore_workers: 2
    adapt_role: true
    synthesis_merge_artifacts: true
    synthesis_reserve_usd: 3.0
    call_timeout_seconds: 600
    timeout_seconds: 7200
    initial_concurrency: 1
    concurrency: 4
  openai:
    model: gpt-6.1-sol
    reasoning_effort: high
    budget_usd: 5.0
    max_output_tokens: 40000
    max_tool_calls: 25
    initial_concurrency: 3
    concurrency: 12
  gemini:
    agent: deep-research-preview-04-2026
    billing_model: gemini-3.1-pro-preview
    budget_usd: 5.0
    initial_concurrency: 2
    concurrency: 8

judges:
  openai:
    model: gpt-6-astra
    reasoning_effort: high
    max_output_tokens: 32768
    initial_concurrency: 4
    concurrency: 16
  gemini:
    model: gemini-4-argon
    thinking_level: high
    max_output_tokens: 32768
    initial_concurrency: 4
    concurrency: 16

analysis:
  bootstrap_samples: 1000
  seed: 2026
  workers: 0  # Automatic CPU parallelism for bootstrap analysis.
