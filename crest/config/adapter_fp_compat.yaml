# ADAPTER FINGERPRINT COMPATIBILITY LEDGER
#
# WHY THIS EXISTS. cache.py::adapter_fingerprint hashes the RAW SOURCE of harness/agents.py and
# harness/keys.py. That is deliberate and sound -- two cleverer schemes were tried and both were
# unsound in the expensive direction (per-class getsource missed inherited methods and module-level
# helpers; comment-stripping was not stable across Python versions, and PEP 701 changed f-string
# tokenization inside the SUPPORTED range). See that function's docstring.
#
# The price is that ANY edit to either module invalidates every cached generation, including edits
# that cannot possibly change a generated answer. That price came due on 2026-07-31: a retry-policy
# change stranded 243 paid generations, which made recovering 7 failed records cost a full re-run.
#
# This ledger is the narrow escape hatch. A human may ASSERT that a specific source-hash transition
# was generation-neutral, with a reason, once, in a reviewable file. Nothing is inferred: the default
# stays "different source => different fingerprint => re-generate".
#
# RULES FOR ADDING AN ENTRY -- read before you do.
#   1. The change must be incapable of altering what a model returns. Retry policy, key pooling,
#      cooldowns, logging, comments, type hints, and error-message text qualify. ANYTHING that
#      touches a prompt, a model id, a tool declaration, a token limit, a reasoning-effort setting,
#      a temperature, or the parsing of a response DOES NOT, no matter how small it looks.
#   2. Diff the two commits before asserting. Record the commit range in `reason`.
#   3. If you are unsure, do not add the entry. Re-generating costs money; a wrong entry silently
#      attributes answers to code that did not produce them, which is the failure the fingerprint
#      exists to prevent and is not detectable afterwards.
#
# Equivalence is treated as transitive and symmetric, so a chain A->B->C makes A and C equivalent.
# Cache hits served through an assertion are logged, and the serving record carries
# `adapter_fp_compat` naming the source hash it was actually generated under.

equivalences:
  - from: "35a422715024"        # abae78a -- the source state that produced run 2026-07-31T193800Z.
                                # VERIFIED, not assumed: this hash reproduces the `adapter_fp`
                                # recorded in that run on 5 of 5 sampled records.
    to:   "904217d03a66"        # HEAD after 050e59d + 66a1c80
    date: "2026-07-31"
    reason: >
      Commits 050e59d and 66a1c80. agents.py gained a `_GEMINI_DR_FLAKY` tuple, an `extra=` parameter
      on `_retry`, and `extra=_GEMINI_DR_FLAKY, attempts=3` on the Gemini deep-research
      interactions.create call. keys.py gained a provider-wide cooldown gate. All of it is retry and
      rate-limit policy: it changes whether a call is re-attempted after a failure, never what is
      sent or how a response is parsed. No prompt, model id, tool declaration, token limit or
      reasoning setting was touched. Verified by diffing agents.py and keys.py across abae78a..66a1c80.

  - from: "904217d03a66"        # a56217f -- produced runs 015432Z and 022516Z
    to:   "1f86b6bd919a"        # HEAD: gemini-dr retry base_sleep 5s -> 60s, explicit store=True
    date: "2026-08-01"
    reason: >
      Two changes to GeminiDeepResearchAPI.run, both argued below rather than assumed, because this
      one is closer to the line than the previous entry.
      (1) _retry base_sleep 5.0 -> 60.0 on the create call. Pure retry timing: it changes how long we
      wait between attempts after a failure, never what is sent. Unambiguously generation-neutral.
      (2) store=True is now passed explicitly where the SDK previously omitted the field. This is a
      REQUEST-SHAPE change, so it does not qualify under the blanket "retry policy" exemption and
      needs its own argument. `store` controls whether the interaction is persisted server-side for
      later retrieval; it is not a generation parameter and cannot alter model output. Google's own
      docs state that background execution REQUIRES store=True and that store=false is "incompatible
      with background execution" -- and every one of our background runs completed and returned
      results (46/50, then 49/50). So the server was already treating store as true; sending it
      explicitly makes the existing behaviour visible rather than changing it. That inference is the
      single non-deductive step in this entry and is recorded as such.
      NOT included and NOT relevant: the errors.jsonl timestamp/pass fields live in run_crest.py,
      which is not part of the fingerprint at all.

  - from: "1f86b6bd919a"        # head of the chain above -- the state that generated all 493
                                # crest_aiml records across runs 193800Z, 015432Z and 031755Z
    to:   "30d57e374361"        # HEAD after 43f1cc10 (the docs->doc rename) + the COI correction
    date: "2026-07-31"
    reason: >
      DOCSTRING TEXT ONLY. Two hunks, both inside triple-quoted module/class docstrings, verified by
      `git diff 43f1cc10^ -- crest/harness/agents.py crest/harness/keys.py`, which returns exactly
      these two and nothing else. keys.py is byte-identical across the span.
      (1) agents.py OpenAIDeepResearchAPI class docstring: the cross-reference
      `docs/notes/deep_research_apis.md` -> `doc/misc/deep_research_apis.md`, a path fixup from the
      directory rename in 43f1cc10.
      (2) agents.py module docstring: the conflict-of-interest paragraph, which asserted "the
      authors' own entrant ... is one entrant among many". That claim is false and was already
      retracted in doc/datasheet.md; _REGISTRY holds commercial models only and `author_entrant` was
      removed. Replaced with the correction.
      Neither hunk is reachable by any code path: no prompt, model id, tool declaration, token limit,
      reasoning-effort setting, temperature or response parser is touched, and a docstring is inert
      at runtime. This is the exact case the ledger's rule 1 names ("comments ... qualify").
      WHY IT MATTERS, and why this entry is not cosmetic: 1f86b6bd919a is the head of the chain
      above, so without this assertion the one-line rename in (1) stranded all 250 cached crest_aiml
      generations -- a measured 250/250 cache hits before 43f1cc10 and 0/250 after, ~$450 to
      re-generate, 100 of those tasks being deep-research at ~$6-9 each. The intermediate hash
      ec4cdd29395a (after (1), before (2)) is deliberately not listed: no generation was ever made
      under it, and transitivity through this entry covers it if one ever is.
