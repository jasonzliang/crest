# CREST pre-registration of per-category predictions and the analysis plan.
#
# WHY THIS FILE EXISTS, AND WHAT IT IS NOT.
# The per-category directions previously lived in `predicted_direction` inside
# questions/crest_challenges.jsonl — one value per category, transcribed across all 50 items, so it
# carried zero item-level information. Worse, it could not evidence ordering: the field sat in an
# editable data file, its original enum value was literally `caesar_win` on the 20 C2/C3 items, and
# it was renamed to `favored` fourteen hours later in a commit titled "honesty fixes". A prediction
# you can `sed` after seeing results is not a pre-registration, and `git log -S caesar_win`
# demonstrates that in one command.
#
# This file is therefore an HONEST INTERMEDIATE, not a fix:
#   * it separates the predictions from the data they predict, so the item file no longer implies a
#     registration it cannot support;
#   * it records what was predicted and when this record was created;
#   * it does NOT establish that the predictions preceded the results. That requires an EXTERNAL
#     timestamped registration (OSF / AsPredicted / a Zenodo-DOI'd signed hash) created before the
#     next run. Until that exists, papers must describe these as "the authors' stated prior
#     expectation, recorded in the repository; not externally timestamped" — never as pre-registered.
#
# stats.py reads this file (it previously accepted a --prereg flag, defaulted it to a path that did
# not exist, and never opened it).

registration:
  created_at: "2026-07-30"
  git_commit_at_creation: "84f7a96"
  externally_timestamped: false        # <- the load-bearing admission
  registry_url: null                   # populate when an OSF/AsPredicted record exists
  supersedes: "predicted_direction field in questions/crest_challenges.jsonl (removed 2026-07-30)"

# Mechanistic account being tested: an architecture that improves relational grounding plus
# convergent refinement should help where structure-mapping (Gentner 1983) and counterfactual
# reasoning (Byrne 2005) are the binding constraint, and should NOT help on parametric/convergent
# tasks. Note only C2/C3 are entailed by that theory; parity on C4 and nulls on C1/C5 are free
# parameters, which is a real weakness of the account and should be stated as such.
predictions:
  C1: predicted_null      # Constrained Synthesis — parametric/convergent; no mechanism advantage
  C2: favored             # Counterfactual Reasoning — Byrne rational imagination
  C3: favored             # Cross-Domain Synthesis — Gentner structure-mapping
  C4: parity              # Meta-Creativity — not entailed by the account
  C5: predicted_null      # Open-Ended Synthesis — not entailed by the account

analysis_plan:
  primary_endpoint: "min(New, Useful, Surprising)"    # ALL THREE axes -- the NUS construct as
                                                     # Torrance/Boden define it. Surprising was
                                                     # briefly dropped on the argument that it is
                                                     # near-redundant; that argument was wrong on
                                                     # its own numbers. Surprising is the SOLE
                                                     # binding axis in 51 of 250 records (20%), not
                                                     # ~1 in 147 as previously stated here, so
                                                     # dropping it changes the endpoint for a fifth
                                                     # of the data. Replaces the thresholded
                                                     # all-three indicator (rate swung 5.4-36.1%
                                                     # across thresholds 5..7 ON THE PILOT;
                                                     # 46.4-56.0% on canonical run 040653Z).
  secondary_endpoints: ["New", "Useful", "Surprising"]   # each axis reported on its own as well.
                                                     # Caveat kept, since it is real and cuts the
                                                     # other way: ablating expert_baseline moved
                                                     # Surprising by only -0.02, so the axis is not
                                                     # anchored by the judge-visible baseline, and
                                                     # r(New, Surprising) = 0.883 at record level
                                                     # (0.946 pooled) -- and that correlation is
                                                     # CONTAMINATED: the v1 prompt told the judge
                                                     # the axes correlate at r~0.95, so it cannot
                                                     # evidence inseparability until a v2
                                                     # re-judge. It is retained on
                                                     # construct grounds and because it binds,
                                                     # not because it is independent.
  # This states the SCORING protocol, not a reported analysis. judge_config.live.yaml sets
  # leave_one_family_out: false, so all three judges score every entrant (verified on canonical run
  # 040653Z: 250/250 records carry the full panel, 250 judge rows are same_family=true) and each judge
  # row is stamped `same_family`. The covariate adjustment and the LOFO subset are therefore
  # RECOVERABLE post-hoc, but stats.py performs NEITHER today -- nothing in analysis/ reads
  # same_family. This line used to promise both as analyses.
  judge_protocol: "full panel; same_family stamped per judge row (covariate + LOFO recoverable, not yet run)"
  tost_equivalence_bounds: [-1.0, 1.0]               # on the 1-10 scale, for reading nulls as
                                                     # evidence-for-equivalence rather than absent power
  reliability_reported: ["icc_1_1", "icc_1_k", "krippendorff_alpha", "per_judge_severity",
                         # AMENDMENT 2026-07-31, and it must be read as one. These four were added
                         # AFTER seeing the data, because the one-way figures came out at ~0 and the
                         # cause was identified as a 3.2-3.7-point judge severity spread that the
                         # one-way model absorbs into error. The two-way model reverses the headline
                         # (Useful 0.0 -> ICC(3,k) 0.807, clearing the 0.80 bar), which is exactly
                         # the kind of post-hoc choice a registration exists to constrain. Treat
                         # ICC(3,*) as EXPLORATORY and report the one-way figures alongside it
                         # always; the pre-data commitment was to the one-way numbers.
                         "icc_1_1_raw", "icc_3_1", "icc_3_k", "judge_effect_var_share"]
  ranking_claims: none                               # judge severity exceeded the between-agent
                                                     # spread; no leaderboard claim is made
